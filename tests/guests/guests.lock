# SPDX-License-Identifier: MIT
#
# The pins of the harness guests: every image, kernel package, source and
# host tool the guests of tests/harness/homa/guest.py boot from or install,
# each by the URL it is fetched from and the SHA-256 and size of the file.
# guest.py fetches an entry into target/guests/cache/ under `file` and refuses
# it where the size or the hash differ, and a guest's provisioning script
# checks the hash again inside the guest, so no byte a guest runs is taken on
# trust. The guests are A and B from the Fedora 43 cloud image and C on the
# koji kernel 6.17.8-300.fc43 with HomaModule at 50d65305. `guests` names the
# guests that take an entry, and an entry no guest takes is a tool of the host.
#
# The koji URLs name the build as koji stores it, which is the file each
# SHA-256 below was computed over on 2026-09-28. A package a guest installs
# from the Fedora repositories and does not name here, such as tcpdump, comes
# signed from those repositories through dnf.

version = 1

# The Fedora 43 cloud image, whose kernel is 6.17.1-300.fc43 with pages of
# 4 KiB (the published CHECKSUM file of the release names this SHA-256).
[[artifact]]
name = "fedora-cloud-base-43-1.6"
kind = "image"
url = "https://download.fedoraproject.org/pub/fedora/linux/releases/43/Cloud/aarch64/images/Fedora-Cloud-Base-Generic-43-1.6.aarch64.qcow2"
file = "Fedora-Cloud-Base-Generic-43-1.6.aarch64.qcow2"
sha256 = "66031aea9ec61e6d0d5bba12b9454e80ca94e8a79c913d37ded4c60311705b8b"
size = 544997376
guests = ["A", "B", "C"]

