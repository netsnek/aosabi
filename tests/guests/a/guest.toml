# SPDX-License-Identifier: MIT
# Guest A of the harness: the Fedora 43 cloud image on its own kernel, for the
# emulated carriers of 26, 27 and 28, the namespaces and the queuing
# discipline of 29_homa_raw, the helper homa-raw and the crate's kernel module
# of stage H5. The host has neither tc nor dummy_hcd, so they run here.

name = "A"
description = "Fedora 43 cloud image with its kernel-devel, the rustc its kernel names, iproute-tc, bluez with btvirt, dummy_hcd and tcpdump"
image = "fedora-cloud-base-43-1.6"
kernel = "6.17.1-300.fc43.aarch64"
artifacts = [
    "kernel-modules-6.17.1-300.fc43",
    "kernel-devel-6.17.1-300.fc43",
    "rust-1.90.0-1.fc43",
    "rust-std-static-1.90.0-1.fc43",
    "clippy-1.90.0-1.fc43",
    "dummy_hcd-v6.17.1",
    "bluez-5.87",
]
phases = ["provision.sh"]
