# SPDX-License-Identifier: MIT
#
# The continuous integration of Aosabi, run on every push and on every pull request.
#
# The job rust runs on both architectures Aosabi is built on, x86_64 and aarch64. It checks the
# formatting, lints with clippy, builds the workspace and runs the fast subset of the notebook
# matrix that .github/scripts/fast_tests.py names. The job tree checks the license of every file
# and scans the tree for private keys and access tokens.
#
# Every action is pinned to the commit of a release, with its tag beside it, and a pin moves by
# hand, since no bot proposes dependencies to this repository. No job reads a secret, and the
# token of every job can only read the repository.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: "1"

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The file rust-toolchain.toml pins the compiler with its components and targets, and
      # rustup installs what it names. The component llvm-tools of the same release gives the
      # notebooks that read the size of a build their llvm-size and llvm-nm.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "$(rustc --print sysroot)/lib/rustlib/$host/bin" >> "$GITHUB_PATH"
          rustc -vV
          cargo -V

      # The key follows the lock and the toolchain, so a run saves the cache once per lock and
      # every later run starts from the dependencies built before.
      - name: Restore the cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      # A virtual workspace formats its members with cargo fmt. The flag --all would also take
      # the forks under third_party/, which stay as their upstream wrote them.
      - name: Check the formatting
        run: cargo fmt --check

      - name: Lint with clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build the workspace
        run: cargo build --locked --workspace

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/pyproject.toml

      # The harness takes the pinned packages of tests/pyproject.toml and runs every notebook in
      # the kernel aosabi of tests/.venv. The file names no build backend, so pip takes its
      # dependencies as a list of requirements.
      - name: Install the notebook harness
        run: |
          python -I - > "$RUNNER_TEMP/requirements.txt" <<'EOF'
          import tomllib

          with open("tests/pyproject.toml", "rb") as stream:
              print("\n".join(tomllib.load(stream)["project"]["dependencies"]))
          EOF
          python -m venv tests/.venv
          tests/.venv/bin/python -m pip install --disable-pip-version-check --no-input \
            --requirement "$RUNNER_TEMP/requirements.txt"
          tests/.venv/bin/python -m ipykernel install --sys-prefix --name aosabi \
            --display-name aosabi

      # The runner of the matrix keeps the locks of its job slots under XDG_RUNTIME_DIR, and so
      # does the harness with a socket whose path would be too long, so the step names the
      # temporary directory of the job, which every hosted runner has.
      - name: Run the fast notebooks
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}
        run: python3 -I .github/scripts/fast_tests.py --python tests/.venv/bin/python --jobs 2

      - name: Keep the executed notebooks of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notebooks-${{ matrix.runner }}
          path: tests/notebooks/out/
          retention-days: 7
          if-no-files-found: ignore

  tree:
    name: Licenses and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Lint the licenses
        run: python3 -I .github/scripts/license_lint.py

      - name: Scan for private keys and access tokens
        run: python3 -I .github/scripts/tree_scan.py
