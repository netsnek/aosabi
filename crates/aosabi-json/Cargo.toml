# The JSON writer. Documentation/architecture.md section 3 names it the only crate that turns
# a number, a string or an object into bytes, and docs/byte-equality.md section
# 6 is the contract it satisfies. The crate is no_std with alloc, because the
# kernel and the player link it.
[package]
name = "aosabi-json"
version = "0.0.0"
description = "The only crate that turns a number, a string or an object into JSON bytes, the way V8 writes them."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The standard library, for the keyed hasher every map of src/map.rs carries
# where the standard library reaches a source of entropy (src/value.rs,
# KeyHasherBuilder). A host build turns it on through the feature std of
# aosabi-core. A build with it for a target whose standard library reaches
# no source of entropy keeps the key the platform hands the function seed for
# the maps of its thread. A build without it has no seed and hashes with the
# fixed key (src/value.rs, KeyState and seed).
std = []
# The group of four control bytes on every target, which a target of 32 bits
# such as the ESP32-C3 probes with anyway (src/map/table.rs). It changes the
# speed of a lookup and no answer, and tests/notebooks/01_json_writer.ipynb
# turns it on to replay the map through that group on the host.
narrow-group = []

[dependencies]
# The digits of ECMA-262 Number::toString need no crate. The port of Ryu under
# src/number/ is written with no unsafe, the crate computes its small table
# when it compiles, and NOTICE carries the notice of Ryu.
#
# The insertion ordered map needs no outside crate either. The map of
# src/map.rs is written with no unsafe and no atomic operation, its index
# table translates the generic group of hashbrown, and NOTICE carries the
# notice of hashbrown (docs/dependencies.md section 3.1).
#
# Where the standard library does not key the map, it hashes with the
# SipHash-1-3 of the crate homa of this workspace, the one SipHash the
# workspace holds (src/value.rs, KeyHasher). The crate homa has no dependency,
# and without its default features it builds no role of the protocol.
homa = { path = "../homa", default-features = false }
