# The compatibility register. It is the one place a Pylon defect that Aosabi reproduces on
# purpose is written down, so a failing comparison cites an identifier rather than a guess.
# It carries no dependency and no code beyond the register itself.
[package]
name = "aosabi-compat"
version.workspace = true
description = "The register of Pylon defects Aosabi reproduces on purpose, and the list of what it deliberately does not port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

